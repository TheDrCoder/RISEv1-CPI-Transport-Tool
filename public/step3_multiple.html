<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Step 3 - Multiple IFlow Deployment</title>
    <script src="script.js" defer></script>
    <style>
        /* Fullscreen Background */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #181818;
            padding: 0;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: white;
            zoom: 80%;
        }

        /* Title Styling */
        .title-container {
            text-align: center;
            padding: 10px;
            width: 100%;
            font-size: 2.0rem;
            font-weight: 300;
            background: linear-gradient(45deg, #ffffff, #d9d9d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.2);
        }

        /* Artifact Selection Container */
        .artifact-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            margin: auto;
            padding: 5px;
        }

        /* Table Container */
        .table-container {
            background: white;
            padding: 10px;
            border-radius: 8px;
            width: 90%;
            min-width: 600px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            color: black;
            text-align: center;
            max-height: 300px;
            overflow-y: auto;
            margin: 10px;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f5f5f5;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 2;
            color: black; /* ✅ Ensure text is black */
        }

    

        /* Ensure Buttons Are Centered */
        
        .btn-group {
    display: flex;
    justify-content: center; /* Centers buttons */
    align-items: center;
    gap: 20px;
    margin-top: 20px;
    padding-bottom: 20px;
    width: 100%;
}

        /* Buttons */
        .primary-btn, .secondary-btn {
            width: 180px;
            padding: 12px 24px;
            font-size: 18px;
            text-align: center;
        }

        .primary-btn {
            background: #F2004B;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .secondary-btn {
            background: #4CAF50;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .primary-btn:hover {
            background: #F2004B;
            transform: scale(1.2);
        }

        .secondary-btn:hover {
            background: #45a049;
            transform: scale(1.2);
        }

        /* Paired Table */
        .paired-container {
            width: 80%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Title Container -->
    <div class="title-container">
        <h1>Multiple IFlow Deployment</h1>
    </div>

    <!-- Artifact Selection -->
    <div class="artifact-container">
        <!-- Source Artifacts -->
        <div class="table-container">
            <h3>Source Integration Artifacts</h3>
            <table id="sourceArtifactsTableMulti">
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>S.No.</th>
                        <th>Artifact Name</th>
                        <th>Version</th>
                        <th>Deployed On</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Target Artifacts -->
        <div class="table-container">
            <h3>Target Integration Artifacts</h3>
            <table id="targetArtifactsTableMulti">
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>S.No.</th>
                        <th>Artifact Name</th>
                        <th>Version</th>
                        <th>Deployed On</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Add Pair Button -->
    <div class="btn-group">
        <button id="addPairBtn" class="primary-btn" disabled>➕ Add Pair</button>
    </div>

    <!-- Paired Selections Table -->
    <div class="paired-container">
        <h3>Selections</h3>
        <table id="pairedSelectionsTable">
            <thead>
                <tr>
                    <th>S.No.</th> <!-- ✅ New Serial Number Column -->
                    <th>Source Artifact</th>
                    <th>Target Artifact</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Buttons Section -->
    <div class="btn-group">
        <button id="prevStep3Multi" class="btn secondary-btn">⬅ Previous</button>
        <button id="deployMultipleIflows" class="btn primary-btn" disabled>🚀 Deploy</button>
    </div>
</body>
</html>
