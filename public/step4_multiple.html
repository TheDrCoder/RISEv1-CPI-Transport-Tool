<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 4 - Multiple IFlow Deployment</title>
    <script src="script.js" defer></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #181818;
            padding: 0;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: white;
            zoom: 80%;
        }

        .title-container {
            text-align: center;
            padding: 10px;
            width: 100%;
            font-family: 'Montserrat', sans-serif !important;
            font-size: 2.0rem;
            font-weight: 300;
            text-align: center;
            background: linear-gradient(45deg, #ffffff, #d9d9d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.2);
        }

        .deployment-container {
            width: 90%;
            max-width: 1200px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            color: black;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            
            border: 1px solid #ddd;
            
        }

        th {
            background: #f5f5f5;
            font-weight: bold;
            color: black;
        }

        tbody tr:nth-child(even) {
            background: #f9f9f9;
        }
        /* ✅ Increase Table Size */

/* ✅ Increase Row Height & Padding */
td, th {
    padding: 12px 15px;
    font-size: 18px; /* Bigger Font */
    text-align: center;
}

/* ✅ Increase Deployment Status Box */
.progress-bar-container {
    width: 100%;
    height: 25px; /* Increase Height */
    background-color: #ddd;
    border-radius: 8px;
    position: relative;
    margin-top: 10px;
}

/* ✅ Improve Progress Bar */
.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #4caf50, #ffeb3b);
    border-radius: 8px;
    transition: width 0.5s ease-in-out;
    text-align: center;
    color: white;
}       


        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .primary-btn, .secondary-btn, .danger-btn {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: 0.3s;
        }

        .primary-btn { background: #F2004B; color: white; font-weight: bold; }
        .secondary-btn { background: #4CAF50; color: white; }
        .danger-btn { background: #ff3b3b; color: white; }

        .primary-btn:hover { background: #ffd600;transform: scale(1.2); }
        .secondary-btn:hover { background: #45a049; transform: scale(1.2);}
        .danger-btn:hover { background: #d63030; transform: scale(1.2);}

        

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>CPI Transport Management Tool</h1>
    </div>

    <div class="deployment-container">
        <h2>Multiple IFlow Deployment Status</h2>

        <!-- Deployment Status Table -->
        <table id="deploymentTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Source Artifact</th>
                    <th>Target Artifact</th>
                    <th>Deployment Progress</th>
                    <th>Deployment Status</th>

                </tr>
            </thead>
            <tbody>
                <!-- Populated dynamically -->
            </tbody>
        </table>

        <!-- Buttons -->
        <div class="btn-group">
            <button id="downloadConfigBtn" class="secondary-btn">📥 Download Configurations</button>
            <button id="abortDeploymentBtn" class="danger-btn">❌ Abort Deployment</button>
            <button id="transportAnotherBtn" class="primary-btn hidden">🔄 Transport New</button>
        </div>

    </div>

</body>
</html>
